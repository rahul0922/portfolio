<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="576" viewBox="0 0 1024 576">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030f1e"/>
      <stop offset="100%" stop-color="#030f1e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1024" height="576" fill="url(#bg)"/>
  <!-- Glow orb -->
  <ellipse cx="512" cy="500" rx="400" ry="200" fill="#38bdf8" opacity="0.08" filter="url(#blur1)"/>
  <!-- Grid lines -->
  <g stroke="#38bdf8" stroke-width="0.5" opacity="0.12">
    <line x1="0" y1="144" x2="1024" y2="144"/>
    <line x1="0" y1="288" x2="1024" y2="288"/>
    <line x1="0" y1="432" x2="1024" y2="432"/>
    <line x1="256" y1="0" x2="256" y2="576"/>
    <line x1="512" y1="0" x2="512" y2="576"/>
    <line x1="768" y1="0" x2="768" y2="576"/>
  </g>
  <!-- Corner brackets -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <polyline points="40,40 40,70 70,70"/>
    <polyline points="984,40 984,70 954,70"/>
    <polyline points="40,536 40,506 70,506"/>
    <polyline points="984,536 984,506 954,506"/>
  </g>
  <!-- Center icon placeholder -->
  <g transform="translate(512,260)" opacity="0.4">
    <circle r="60" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 4"/>
    <circle r="10" fill="#38bdf8" opacity="0.8"/>
    <line x1="0" y1="-60" x2="0" y2="-45" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="45" x2="0" y2="60" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-60" y1="0" x2="-45" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="45" y1="0" x2="60" y2="0" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <!-- Title text -->
  <text x="512" y="360" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#38bdf8" opacity="0.9">UNDERWATER CAUSTICS</text>
  <text x="512" y="392" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" letter-spacing="2" fill="#ffffff" opacity="0.4">Final Environment Render</text>
  <!-- Loading bar -->
  <rect x="362" y="430" width="300" height="2" rx="1" fill="white" opacity="0.08"/>
  <rect x="362" y="430" width="90" height="2" rx="1" fill="#38bdf8" opacity="0.7"/>
  <text x="512" y="458" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="1" fill="#38bdf8" opacity="0.5">IMAGE RENDERING — QUOTA RESETS SOON</text>
  <!-- Blender-like status bar at top -->
  <rect x="0" y="0" width="1024" height="28" fill="black" opacity="0.7"/>
  <text x="16" y="18" font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.8">Blender 4.0 | UNDERWATER CAUSTICS | Solid View — Clay Shading</text>
</svg>